# Sourced from ~/.tmux.conf by install.sh
set -g mouse on                 # touch scrolling
set -g history-limit 20000
set -g status-style "bg=colour236,fg=colour250"
set -g status-right "#{?@claude_session,claude ,}%H:%M"
# install.sh adds, in ~/.tmux.conf, hooks that snapshot sessions as soon as one opens or closes.
